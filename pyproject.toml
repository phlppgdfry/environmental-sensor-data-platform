[project]
name = "sensor-platform"
version = "0.2.0"
description = "Production-style Python data platform for environmental sensor provisioning, ThingsBoard integration, telemetry processing, data-quality validation and reporting."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "SQLAlchemy>=2.0",
    "psycopg2-binary>=2.9",
    "plotly>=5.22",
    "matplotlib>=3.9",
    "jinja2>=3.1",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "streamlit>=1.36",
    "pyarrow>=16.1",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "paho-mqtt>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-requests",
    "freezegun>=1.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=src/sensor_platform --cov-report=term-missing -m 'not integration'"
markers = [
    "integration: requires live PostgreSQL and/or ThingsBoard services (see tests/integration/); run with `pytest -m integration`",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom requires calling Depends() in
# argument defaults; that's a false positive for B008 here.
"src/sensor_platform/api/app.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
