name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests scripts dashboard
      - name: Type check (mypy)
        run: mypy src
      - name: Tests
        run: pytest --cov=src/sensor_platform --cov-report=term-missing

  demo-report:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python scripts/simulate_sensors.py --sensors 200 --hours 24
      - run: python scripts/generate_report.py --project BRUGGE-01
      - uses: actions/upload-artifact@v4
        with:
          name: sample-report
          path: reports/generated/
